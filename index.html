<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Host Access — Spin the Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#121214',
          paper: '#F6F3EC',
          ember: '#D9491A',
          slate: '#2F4A45',
          sand: '#C9BFAE',
          success: '#55857C',
        },
        fontFamily: {
          display: ['"General Sans"', 'sans-serif'],
          body: ['"General Sans"', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'monospace'],
        },
      },
    },
  }
</script>
<style>
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body class="bg-ink font-body text-paper antialiased min-h-screen">

<main class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <p class="font-mono text-xs uppercase tracking-[0.2em] text-sand mb-3">CONIQ Spinner</p>
    <h1 class="font-display text-[40px] font-bold tracking-tight mb-2">Host Access</h1>
    <p class="text-sand text-sm mb-8">Sign in to run today's wheel.</p>

    <div class="relative rounded-2xl bg-slate border border-paper/10 p-6">
      <span class="absolute top-3 left-3 h-2 w-2 rounded-full bg-sand/30"></span>
      <span class="absolute top-3 right-3 h-2 w-2 rounded-full bg-sand/30"></span>
      <span class="absolute bottom-3 left-3 h-2 w-2 rounded-full bg-sand/30"></span>
      <span class="absolute bottom-3 right-3 h-2 w-2 rounded-full bg-sand/30"></span>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="email" class="block text-xs font-mono uppercase tracking-wider text-sand mb-2">Email</label>
          <input id="email" name="email" type="email" required autofocus
            class="w-full rounded-lg bg-ink border border-paper/20 px-4 py-3 text-paper placeholder-sand/40 focus:outline-none focus:ring-2 focus:ring-ember"
            placeholder="you@company.com" />
        </div>
        <div>
          <label for="password" class="block text-xs font-mono uppercase tracking-wider text-sand mb-2">Password</label>
          <input id="password" name="password" type="password" required
            class="w-full rounded-lg bg-ink border border-paper/20 px-4 py-3 text-paper placeholder-sand/40 focus:outline-none focus:ring-2 focus:ring-ember"
            placeholder="••••••••" />
        </div>

        <p id="error-message" class="hidden text-sm text-ember bg-ember/10 border border-ember/30 rounded-lg px-3 py-2"></p>

        <button type="submit" id="submit-btn"
          class="w-full rounded-lg bg-ember text-ink font-semibold py-3 hover:brightness-110 transition">
          Sign in
        </button>
      </form>
    </div>

    <p class="text-sand/60 text-xs mt-6">Host accounts are created by an admin in Supabase — there's no public sign-up.</p>
  </div>
</main>

<script type="module">
  import { supabase } from './supabase-client.js';

  const { data: { session } } = await supabase.auth.getSession();
  if (session) window.location.href = './host.html';

  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('error-message');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      errorEl.textContent = error.message;
      errorEl.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
      return;
    }

    window.location.href = './host.html';
  });
</script>
</body>
</html>
