<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Access CONIQ Studio — Spin the Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          backstage: '#17151C',
          panel: '#221F29',
          marquee: '#E8A33D',
          felt: '#4F7942',
          ticket: '#F3EFE6',
          dust: '#8B8394',
          stamp: '#C1553D',
        },
        fontFamily: {
          display: ['"Big Shoulders Display"', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'monospace'],
        },
      },
    },
  }
</script>
<style>
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body class="bg-backstage font-body text-ticket antialiased min-h-screen">

<main class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <p class="font-mono text-xs uppercase tracking-[0.2em] text-dust mb-3">Stage Door</p>
    <h1 class="font-display text-4xl font-bold tracking-tight mb-2">Host Access</h1>
    <p class="text-dust text-sm mb-8">Sign in to run today's wheel.</p>

    <div class="relative rounded-2xl bg-panel border border-white/5 p-6">
      <span class="absolute top-3 left-3 h-1.5 w-1.5 rounded-full bg-dust/30"></span>
      <span class="absolute top-3 right-3 h-1.5 w-1.5 rounded-full bg-dust/30"></span>
      <span class="absolute bottom-3 left-3 h-1.5 w-1.5 rounded-full bg-dust/30"></span>
      <span class="absolute bottom-3 right-3 h-1.5 w-1.5 rounded-full bg-dust/30"></span>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="email" class="block text-xs font-mono uppercase tracking-wider text-dust mb-1.5">Email</label>
          <input id="email" name="email" type="email" required autofocus
            class="w-full rounded-lg bg-backstage border border-white/10 px-3.5 py-2.5 text-ticket placeholder-dust/40 focus:outline-none focus:ring-2 focus:ring-marquee"
            placeholder="you@company.com" />
        </div>
        <div>
          <label for="password" class="block text-xs font-mono uppercase tracking-wider text-dust mb-1.5">Password</label>
          <input id="password" name="password" type="password" required
            class="w-full rounded-lg bg-backstage border border-white/10 px-3.5 py-2.5 text-ticket placeholder-dust/40 focus:outline-none focus:ring-2 focus:ring-marquee"
            placeholder="••••••••" />
        </div>

        <p id="error-message" class="hidden text-sm text-stamp bg-stamp/10 border border-stamp/30 rounded-lg px-3 py-2"></p>

        <button type="submit" id="submit-btn"
          class="w-full rounded-lg bg-marquee text-backstage font-semibold py-2.5 hover:brightness-110 transition">
          Sign in
        </button>
      </form>
    </div>

    <p class="text-dust/60 text-xs mt-6">Host accounts are created by an admin in Supabase — there's no public sign-up.</p>
  </div>
</main>

<script type="module">
  import { supabase } from './supabase-client.js';

  const { data: { session } } = await supabase.auth.getSession();
  if (session) window.location.href = './host.html';

  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('error-message');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      errorEl.textContent = error.message;
      errorEl.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
      return;
    }

    window.location.href = './host.html';
  });
</script>
</body>
</html>
