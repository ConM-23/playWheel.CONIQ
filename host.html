<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CONIQ Studio — Spin the Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          backstage: '#17151C',
          panel: '#221F29',
          marquee: '#E8A33D',
          felt: '#4F7942',
          ticket: '#F3EFE6',
          dust: '#8B8394',
          stamp: '#C1553D',
        },
        fontFamily: {
          display: ['"Big Shoulders Display"', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'monospace'],
        },
      },
    },
  }
</script>
</head>
<body class="bg-backstage font-body text-ticket antialiased min-h-screen">

<main class="min-h-screen px-6 py-10 hidden" id="app">
  <div class="max-w-3xl mx-auto">
    <div class="flex items-start justify-between mb-10">
      <div>
        <p class="font-mono text-xs uppercase tracking-[0.2em] text-dust mb-2">Host Console</p>
        <h1 class="font-display text-3xl font-bold tracking-tight" id="exp-title">—</h1>
        <p class="text-dust font-mono text-sm mt-1" id="exp-slug">—</p>
      </div>
      <button id="signout-btn" class="text-sm text-dust hover:text-ticket transition-colors">Sign out</button>
    </div>

    <div class="h-2 rounded-full mb-8 opacity-60"
      style="background-image: radial-gradient(circle, #E8A33D 1.5px, transparent 1.5px); background-size: 14px 100%;"></div>

    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4" id="tiles"></div>
  </div>
</main>

<script type="module">
  import { supabase } from './supabase-client.js';

  const { data: { user } } = await supabase.auth.getUser();
  if (!user) {
    window.location.href = './index.html';
  }

  async function getOrCreateExperience() {
    const { data: existing } = await supabase
      .from('experiences')
      .select('*')
      .eq('host_id', user.id)
      .maybeSingle();

    if (existing) return existing;

    const slug = 'event-' + Math.random().toString(36).slice(2, 8);
    const { data: created, error } = await supabase
      .from('experiences')
      .insert({ host_id: user.id, title: 'Spin the Wheel', slug })
      .select()
      .single();

    if (error) throw error;
    return created;
  }

  const TILES = [
    { number: '01', name: 'Setup', ready: true },
    { number: '02', name: 'Style', ready: false },
    { number: '03', name: 'Inventory', ready: false },
    { number: '04', name: 'Play', ready: false },
    { number: '05', name: 'Report', ready: false },
  ];

  function renderTiles() {
    const container = document.getElementById('tiles');
    container.innerHTML = TILES.map(tile => `
      <div class="relative rounded-2xl border p-5 aspect-square flex flex-col justify-between ${
        tile.ready
          ? 'bg-panel border-white/5 hover:border-marquee/40 cursor-pointer transition-colors'
          : 'bg-panel/50 border-white/5 opacity-60'
      }">
        <div class="flex items-center justify-between">
          <span class="font-mono text-xs text-dust">${tile.number}</span>
          <span class="h-2 w-2 rounded-full ${
            tile.ready ? 'bg-felt shadow-[0_0_8px_2px_rgba(79,121,66,0.6)]' : 'bg-dust/30'
          }"></span>
        </div>
        <div>
          <p class="font-display text-xl font-bold">${tile.name}</p>
          ${!tile.ready ? '<p class="font-mono text-[10px] uppercase tracking-wider text-dust mt-1">Coming soon</p>' : ''}
        </div>
      </div>
    `).join('');
  }

  const experience = await getOrCreateExperience();
  document.getElementById('exp-title').textContent = experience.title;
  document.getElementById('exp-slug').textContent = '/' + experience.slug;
  renderTiles();
  document.getElementById('app').classList.remove('hidden');

  document.getElementById('signout-btn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = './index.html';
  });
</script>
</body>
</html>
