<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Host Console — Spin the Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#121214',
          paper: '#F6F3EC',
          ember: '#D9491A',
          slate: '#2F4A45',
          sand: '#C9BFAE',
          success: '#55857C',
        },
        fontFamily: {
          display: ['"General Sans"', 'sans-serif'],
          body: ['"General Sans"', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'monospace'],
        },
      },
    },
  }
</script>
</head>
<body class="bg-ink font-body text-paper antialiased min-h-screen">

<main class="min-h-screen px-6 py-10 hidden" id="app">
  <div class="max-w-3xl mx-auto">
    <div class="flex items-start justify-between mb-10">
      <div>
        <p class="font-mono text-xs uppercase tracking-[0.2em] text-sand mb-2">Host Console</p>
        <h1 class="font-display text-[64px] font-bold tracking-tight leading-none" id="exp-title">—</h1>
        <p class="text-sand font-mono text-sm mt-2" id="exp-slug">—</p>
      </div>
      <button id="signout-btn" class="text-sm text-sand hover:text-paper transition-colors">Sign out</button>
    </div>

    <div class="h-2 rounded-full mb-8 opacity-60"
      style="background-image: radial-gradient(circle, #D9491A 1.5px, transparent 1.5px); background-size: 14px 100%;"></div>

    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4" id="tiles"></div>
  </div>
</main>

<script type="module">
  import { supabase } from './supabase-client.js';

  const { data: { user } } = await supabase.auth.getUser();
  if (!user) {
    window.location.href = './index.html';
  }

  async function getOrCreateExperience() {
    const { data: existing } = await supabase
      .from('experiences')
      .select('*')
      .eq('host_id', user.id)
      .maybeSingle();

    if (existing) return existing;

    const slug = 'event-' + Math.random().toString(36).slice(2, 8);
    const { data: created, error } = await supabase
      .from('experiences')
      .insert({ host_id: user.id, title: 'Spin the Wheel', slug })
      .select()
      .single();

    if (error) throw error;
    return created;
  }

  const TILES = [
    { number: '01', name: 'Setup', ready: true, href: './setup.html' },
    { number: '02', name: 'Style', ready: true, href: './style.html' },
    { number: '03', name: 'Inventory', ready: false },
    { number: '04', name: 'Play', ready: false },
    { number: '05', name: 'Report', ready: false },
  ];

  function renderTiles() {
    const container = document.getElementById('tiles');
    container.innerHTML = TILES.map(tile => {
      const inner = `
        <div class="flex items-center justify-between">
          <span class="font-mono text-xs text-sand">${tile.number}</span>
          <span class="h-2 w-2 rounded-full ${
            tile.ready ? 'bg-success shadow-[0_0_8px_2px_rgba(85,133,124,0.6)]' : 'bg-sand/30'
          }"></span>
        </div>
        <div>
          <p class="font-display text-[28px] font-bold leading-tight">${tile.name}</p>
          ${!tile.ready ? '<p class="font-mono text-xs uppercase tracking-wider text-sand mt-1">Coming soon</p>' : ''}
        </div>
      `;
      const classes = `relative rounded-2xl border p-5 aspect-square flex flex-col justify-between ${
        tile.ready
          ? 'bg-slate border-paper/10 hover:border-ember/40 cursor-pointer transition-colors'
          : 'bg-slate/50 border-paper/10 opacity-60 cursor-default'
      }`;
      return tile.ready
        ? `<a href="${tile.href}" class="${classes}">${inner}</a>`
        : `<div class="${classes}">${inner}</div>`;
    }).join('');
  }

  const experience = await getOrCreateExperience();
  document.getElementById('exp-title').textContent = experience.title;
  document.getElementById('exp-slug').textContent = '/' + experience.slug;
  renderTiles();
  document.getElementById('app').classList.remove('hidden');

  document.getElementById('signout-btn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = './index.html';
  });
</script>
</body>
</html>
